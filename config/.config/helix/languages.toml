[[language]]
name = "javascript"
auto-format=true

[[language]]
name = "typescript"
auto-format=true

[[language]]
name = "c"
file-types = ["c", "h"]
formatter = { command = 'clang-format' }
auto-format = true

[[language]]
name = "lua"
auto-format = true

[[language]]
name = "cpp"
file-types = ["cpp", "cc", "cxx", "hpp", "hcc", "hxx"]
formatter = { command = 'clang-format' }
auto-format = true

[[language]]
name = "bash"
indent = { tab-width = 2, unit = "    " }
formatter = { command = 'shfmt', args = ["-i", "2", "-ci"] }
auto-format = true

