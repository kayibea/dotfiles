[mgr]
show_hidden = true
show_symlink = true

[opener]
edit = [
  { run = '$EDITOR "$@"', block = true },
]

vlc = [
  { run = 'vlc "$@"', orphan = true },
]

feh = [
  { run = 'feh --auto-zoom --scale-down "$@"', orphan = true },
]

zathura = [
  { run = 'zathura "$@"', orphan = true },
]

archive = [
  { run = 'bsdtar -tf "$@" | less', block = true },
]

default = [
  { run = 'xdg-open "$@"', orphan = true },
]

[open]
rules = [
  { mime = "inode/directory", use = "cd" },
  { mime = "text/*", use = "edit" },
  { mime = "application/{json,javascript}", use = "edit" },
  { mime = "image/*", use = "feh" },
  { mime = "video/*", use = "vlc" },
  { mime = "audio/*", use = "vlc" },
  { mime = "application/pdf", use = "zathura" },
  { mime = "application/{zip,x-tar,x-gzip,x-bzip2}", use = "archive" },
  { mime = "*/*", use = "default" },
]

[plugin]
prepend_previewers = [
  { mime = "image/{avif,heic,jxl,svg+xml}", run = "magick" },
  { mime = "image/*", run = "image" },
  { mime = "video/*", run = "video" },
  { mime = "application/octet-stream", name = "*.dds", run = "magick -define dds:alpha=on" },
  { mime = "application/octet-stream", run = "file" },
]
